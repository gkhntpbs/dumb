# Release build for DUMB (Distributed User-owned Model Backend).
# Cut a release by pushing a vX.Y.Z (or vX.Y.Z-beta.N) tag; see docs/release.md.
# Local dry run: go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean --skip=publish
version: 2
project_name: dumb

builds:
  - id: dumb-worker
    main: ./cmd/dumb-worker
    binary: dumb-worker
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      # The minisign public key workers verify releases against. Empty disables
      # self-update; the release workflow refuses to run without it.
      - -s -w {{ if eq .Os "windows" }}-H windowsgui{{ end }} -X main.version={{ .Version }} -X github.com/gkhntpbs/dumb/internal/update.PublicKey={{ envOrDefault "DUMB_RELEASE_PUBLIC_KEY" "" }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
  - id: dumb-tray
    main: ./cmd/dumb-tray
    binary: dumb-tray
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -H windowsgui]
    goos: [windows]
    goarch: [amd64]
  - id: dumb-server
    main: ./cmd/dumb-server
    binary: dumb-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }

archives:
  # The worker's self-updater looks for exactly this name (internal/update.ArchiveName).
  - id: dumb-worker
    ids: [dumb-worker, dumb-tray]
    name_template: "dumb-worker_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    files: [LICENSE, README.md]
  - id: dumb-server
    ids: [dumb-server]
    name_template: "dumb-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    files: [LICENSE, README.md]

# checksums.txt is what gets signed (checksums.txt.minisig, added by the workflow).
checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc

release:
  github:
    owner: gkhntpbs
    name: dumb
  # Published by the workflow only after checksums.txt.minisig is attached.
  draft: true
  prerelease: auto
