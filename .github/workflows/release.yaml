# Cuts a release when a vX.Y.Z / vX.Y.Z-beta.N tag is pushed. See docs/release.md.
#
# Repository configuration (names only; values live in GitHub settings, never here):
#   secrets.MINISIGN_SECRET_KEY  minisign secret key file contents (encrypted)
#   secrets.MINISIGN_PASSWORD    its password
#   vars.MINISIGN_PUBLIC_KEY     the matching public key line ("RW..."), embedded in workers
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Locked caller tooling
        run: |
          npm install --global npm@11.12.1
          npm ci --prefix clients/typescript --ignore-scripts
      - name: Download locked Go modules
        run: go mod download
      - name: macOS native build gate
        run: ./qa-automation/scripts/build-gate.sh
      - name: Build macOS worker application
        env:
          DUMB_BUILD_ARCH: ${{ matrix.arch }}
          DUMB_MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          test -n "$DUMB_MINISIGN_PUBLIC_KEY"
          export DUMB_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          export DUMB_BUILD_ZIP="$PWD/dist/dumb-worker-app_${DUMB_BUILD_VERSION}_darwin_${DUMB_BUILD_ARCH}.zip"
          ./scripts/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.arch }}
          path: dist/dumb-worker-app_*.zip
          if-no-files-found: error
  release:
    needs: macos-app
    runs-on: ubuntu-latest
    env:
      DUMB_RELEASE_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Locked caller tooling
        run: |
          npm install --global npm@11.12.1
          npm ci --prefix clients/typescript --ignore-scripts

      - name: Build gate
        run: ./qa-automation/scripts/build-gate.sh

      - name: Require the release public key
        run: |
          if [ -z "$DUMB_RELEASE_PUBLIC_KEY" ]; then
            echo "::error::vars.MINISIGN_PUBLIC_KEY is not set; workers would be built with self-update disabled"
            exit 1
          fi

      - name: Build and upload (draft release)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-app-*
          path: dist
          merge-multiple: true

      - name: Add macOS application checksums
        run: |
          cd dist
          sha256sum dumb-worker-app_*.zip >> checksums.txt

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign checksums.txt
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m dist/checksums.txt \
            -t "dumb $GITHUB_REF_NAME checksums.txt"
          # Never publish a signature the workers would reject.
          minisign -V -P "$DUMB_RELEASE_PUBLIC_KEY" -m dist/checksums.txt

      - name: Attach the signature and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/dumb-worker-app_*.zip dist/checksums.txt dist/checksums.txt.minisig --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
