openapi: 3.1.0
info:
  title: DUMB protocol
  version: "1"
  license:
    name: MIT
    identifier: MIT
  description: >
    DUMB (Distributed User-owned Model Backend) contract. Three audiences share one
    server:


    * **Workers** only make outbound HTTPS requests. They introduce themselves
    (hello), long-poll for a job and post its result. Every worker request carries
    `X-DUMB-Worker-Version`; a worker below the server's minimum gets `426` on any
    endpoint, never a job.

    * **Callers** (other apps) submit a job with a deadline and may wait for the
    result in the same request. When no worker can serve the model the server
    answers `503` immediately so the caller can take its cloud path at once.


    A job's lease ends at the job's deadline. A job whose lease expires is never
    dispatched again: the caller has already given up on it.


    **Cancellation.** The owning caller may cancel a queued or leased job with
    `POST /v1/jobs/{id}/cancel`. A cancelled job is terminal and never dispatched
    again; a leased worker learns about it on its next lease check (`409` from
    ack) and stops generating. Whichever terminal transition (result, deadline
    expiry or cancellation) is committed first wins; later ones are refused.
    Closing a waiting caller connection is never treated as cancellation.


    **Capacity.** A worker never holds more live leases than the `capacity` of its
    last hello. A lease ends when its result is posted (done or failed), when it
    expires, or when its caller cancels the job.


    **Acknowledgement.** A worker whose hello lists the `ack` feature
    acknowledges every assignment with `POST /v1/jobs/{id}/ack`. If the ack does
    not arrive within the server's ack window (default 2s, never beyond the
    job's deadline) the lease is revoked and the job goes back to the front of
    the queue for another worker; the old lease then gets `409` on ack and
    result. This catches an assignment flushed into a dead connection, which
    the server cannot otherwise see. A worker that does not announce `ack`
    (older workers) is never subject to the window; posting a result also
    counts as an ack.


    **Goodbye.** A worker leaving gracefully calls `POST /v1/workers/goodbye`;
    from then on it is not online, so callers get `503` at once instead of
    after the online timeout.


    **Rate limits.** Every principal (worker or caller) has its own token bucket,
    and requests that fail authentication are limited per client IP. The
    credential is always checked first: a valid credential is never refused
    because other clients behind the same IP failed; once a client IP's failure
    bucket is empty, its further failed requests get `429` instead of `401`.
    Exceeding a limit returns `429` with `Retry-After` (seconds). The
    defaults are well above normal long-polling.


    **Request id.** Every response carries `X-Request-ID`: the request's own value
    when it is 1-64 characters of `[A-Za-z0-9._:-]`, otherwise one the server
    generates. Server logs carry the same id.
servers:
  - url: https://dumb.example.invalid
security:
  - bearer: []
tags:
  - name: admin
    description: Private admin metadata and optional cookie-only admin-manage credential operations.
  - name: worker
    description: Endpoints a worker calls (outbound only).
  - name: caller
    description: Endpoints an app calls to get AI work done.
paths:
  /v1/workers/pair:
    post:
      tags: [worker]
      operationId: pairWorker
      summary: Exchange a one-time pairing code for a worker credential.
      description: >
        Optional provider feature. No bearer authentication. Requires JSON and the
        worker version floor. Code and credential are 32 random bytes encoded as
        43-character base64url strings. Exchange consumes the code durably and
        retires previous credentials for the paired worker only on success.
        Secret responses are never cached. Do not automatically retry: a lost
        successful response requires a new pairing code.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkerVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairRequest" }
      responses:
        "200":
          description: One-time plaintext worker credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCredential" }
        "400": { description: "Invalid JSON, code format or version." }
        "401": { description: "Invalid, expired or consumed pairing code." }
        "415": { description: JSON required. }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: Pairing unavailable. }
  /admin/v1/credentials:
    get:
      tags: [admin]
      operationId: adminCredentials
      summary: List current credential metadata without secrets or hashes.
      description: Cookie-only admin-manage; exact configured Origin required, including GET. No bearer fallback. Pagination is offset/limit, not a stable snapshot.
      security: [{ adminCookie: [] }]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Current inventory; never cached; not an audit history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialPage" }
        "400": { description: Invalid pagination. }
        "401": { description: Cookie session lacks admin-manage. }
        "403": { description: Origin denied. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: Management unavailable. }
    post:
      tags: [admin]
      operationId: adminIssueCredential
      summary: Issue a caller or worker credential.
      description: Cookie-only admin-manage, exact configured Origin and JSON required. No administrative credentials can be issued. Plaintext is returned once and never cached.
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCredentialRequest" }
      responses:
        "201":
          description: One-time plaintext credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCredential" }
        "400": { description: Invalid role or required TTL. }
        "401": { description: Cookie session lacks admin-manage. }
        "403": { description: Origin denied. }
        "415": { description: JSON required. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: Management unavailable or capacity exhausted. }
  /admin/v1/credentials/{id}/rotate:
    post:
      tags: [admin]
      operationId: adminRotateCredential
      summary: Atomically replace a credential, preserving principal identity and role.
      description: Cookie-only admin-manage, exact configured Origin and JSON required. The previous credential is immediately retired. Plaintext replacement is returned once.
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateCredentialRequest" }
      responses:
        "200":
          description: One-time plaintext replacement; never cached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCredential" }
        "400": { description: Invalid TTL or credential ID. }
        "401": { description: Cookie session lacks admin-manage. }
        "403": { description: Origin denied. }
        "404": { description: Credential not found. }
        "415": { description: JSON required. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: Management unavailable or capacity exhausted. }
  /admin/v1/credentials/{id}/revoke:
    post:
      tags: [admin]
      operationId: adminRevokeCredential
      summary: Revoke a credential immediately and durably.
      description: Cookie-only admin-manage, exact configured Origin and JSON empty object required. Repeated revoke of a retained credential succeeds. Already accepted leases are not silently cancelled.
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Credential revoked; never cached. }
        "400": { description: Invalid request. }
        "401": { description: Cookie session lacks admin-manage. }
        "403": { description: Origin denied. }
        "404": { description: Credential not found. }
        "415": { description: JSON required. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: Management unavailable. }
  /admin/v1/pairing:
    post:
      tags: [admin]
      operationId: adminCreatePairing
      summary: Create a one-time worker pairing code.
      description: Cookie-only admin-manage, exact configured Origin and JSON required. Optional worker_id preserves an existing worker principal; caller identities cannot be paired. Creation does not retire existing credentials. Plaintext code is returned once and never cached.
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePairingRequest" }
      responses:
        "201":
          description: One-time plaintext pairing code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingCode" }
        "400": { description: Invalid worker ID or required TTLs. }
        "401": { description: Cookie session lacks admin-manage. }
        "403": { description: Origin denied. }
        "404": { description: Existing worker not found. }
        "415": { description: JSON required. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: Management unavailable or capacity exhausted. }
  /admin/v1/session:
    get:
      tags: [admin]
      operationId: adminSession
      summary: Inspect the same-origin browser session.
      description: >
        Returns the authentication state and, for an authenticated session only,
        its role, whether credential management is configured and the optional
        public worker URL. Never returns identity or credentials.
      security: []
      responses:
        "200":
          description: Authentication state without identity or credentials; never cached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "403": { description: Cross-origin request denied. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /admin/v1/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Establish an admin browser session using a password.
      description: >
        Available only with an injected browser session provider. Requires JSON and an
        exact same-origin Origin header. Production uses a Secure, HttpOnly, SameSite
        cookie; password verification and session storage live outside the public server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLogin" }
      responses:
        "204": { description: Session cookie established. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Cross-origin request denied. }
        "415": { description: JSON content type required. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: Browser session provider is not configured. }
  /admin/v1/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      summary: Revoke the browser session and clear its cookie.
      description: Requires an exact same-origin Origin header; safe to repeat.
      security: []
      responses:
        "204": { description: Session revoked and cookie cleared. }
        "403": { description: Cross-origin request denied. }
        "503": { description: Browser session provider is not configured. }
  /admin/v1/summary:
    get:
      tags: [admin]
      security: [{adminCookie: []}, {bearer: []}]
      operationId: adminSummary
      summary: Read sanitized summary metadata.
      description: >
        Requires admin-read. Disabled by default and served on a separate admin listener.
        Each response is an independent observation; worker and queue observations are
        approximate rather than an atomic cross-source snapshot. No prompt, output,
        token, raw error or network address is included.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/AdminModel"
      responses:
        "200":
          description: Current metadata; pagination may shift as jobs and workers change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /admin/v1/api:
    get:
      tags: [admin]
      security: [{adminCookie: []}, {bearer: []}]
      operationId: adminApi
      summary: Observe public HTTP API traffic, excluding the admin listener.
      description: >
        Process-local completed request counters, including rejected and unknown requests.
        The bounded rolling window contains 30 ten-second completion buckets, including
        the current partial bucket. Latency includes long-poll waiting; active polls are
        inflight, not failures. Serving means this API handler is responding, not that
        workers or upstream dependencies are ready. No identities, paths, queries or bodies
        are retained; route labels come from fixed protocol templates.
      responses:
        "200":
          description: API traffic observation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApi" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /admin/v1/workers:
    get:
      tags: [admin]
      security: [{adminCookie: []}, {bearer: []}]
      operationId: adminWorkers
      summary: Read sanitized workers metadata.
      description: >
        Requires admin-read. Disabled by default and served on a separate admin listener.
        Each response is an independent observation; worker and queue observations are
        approximate rather than an atomic cross-source snapshot. No prompt, output,
        token, raw error or network address is included.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/AdminModel"
        - $ref: "#/components/parameters/AdminWorkerState"
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Current metadata; pagination may shift as jobs and workers change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWorkers" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /admin/v1/queue:
    get:
      tags: [admin]
      security: [{adminCookie: []}, {bearer: []}]
      operationId: adminQueue
      summary: Read sanitized queue metadata.
      description: >
        Requires admin-read. Disabled by default and served on a separate admin listener.
        Each response is an independent observation; worker and queue observations are
        approximate rather than an atomic cross-source snapshot. No prompt, output,
        token, raw error or network address is included.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/AdminModel"
        - $ref: "#/components/parameters/AdminJobState"
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Current metadata; pagination may shift as jobs and workers change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQueue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/workers/hello:
    post:
      tags: [worker]
      operationId: workerHello
      summary: Introduce a worker and learn the server's floor and recommended version.
      parameters:
        - $ref: "#/components/parameters/WorkerVersion"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelloRequest" }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelloResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /v1/workers/goodbye:
    post:
      tags: [worker]
      operationId: workerGoodbye
      summary: Leave the pool now (graceful shutdown, restart, no model left).
      description: >
        The worker stops counting as online immediately and its long-polls in
        flight end. Leases it still holds are unaffected: their results are
        still accepted. Saying hello again brings it back. Idempotent.
      parameters:
        - $ref: "#/components/parameters/WorkerVersion"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "204":
          description: The worker is offline.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /v1/workers/me:
    get:
      tags: [worker]
      operationId: workerWhoAmI
      summary: Check the credential and version without side effects.
      description: >
        Unlike hello, this does not mark the worker online. `doctor` uses it to
        verify that the credential is accepted and the version is not too old.
      parameters:
        - $ref: "#/components/parameters/WorkerVersion"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The credential is valid and the version is accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /v1/jobs/next:
    get:
      tags: [worker]
      operationId: claimJob
      summary: Long-poll for the next job this worker can run.
      description: >
        Returns the moment a matching job is queued. The worker must have sent
        hello first; only jobs for the models it announced are handed out.


        A poll beyond the worker's capacity (it already holds `capacity` live
        leases) is not refused: it waits like a poll with no job, and returns a
        job the moment one of those leases ends, or `204` when `wait` runs out.
        Waiting adds no latency and needs no retry, where a refusal would make
        the worker sleep and miss the moment a slot frees.


        If the poll is aborted in the instant a job is claimed for it (the
        connection closed, the response could not be written), the job goes back
        to the front of the queue with its original deadline.
      parameters:
        - $ref: "#/components/parameters/WorkerVersion"
        - $ref: "#/components/parameters/RequestID"
        - name: wait
          in: query
          description: Go duration (e.g. `25s`). Capped at the server's `max_wait`.
          schema: { type: string, default: 25s }
      responses:
        "200":
          description: A job, leased to this worker until `lease_expires_at`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "204":
          description: No job arrived within `wait` (or the worker stayed at capacity).
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/QueueUnavailable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: The worker has not sent hello.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /v1/jobs/{id}/ack:
    post:
      tags: [worker]
      operationId: ackJob
      summary: Acknowledge that an assignment arrived.
      description: >
        Sent right after `GET /v1/jobs/next` returns a job, by workers whose
        hello listed the `ack` feature. Without it the lease is revoked when the
        ack window ends. Acking twice is harmless. While generating, workers check
        the lease with this endpoint every 250ms and cancel generation on 409;
        they also cancel at `lease_expires_at`.
      parameters:
        - $ref: "#/components/parameters/WorkerVersion"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AckRequest" }
      responses:
        "204":
          description: Acknowledged; the lease runs until `lease_expires_at`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/QueueUnavailable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: >
            The lease was revoked (ack too late), has expired, was cancelled by
            its caller, is unknown, or belongs to another worker. Do not run the
            job; stop generating if it already started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /v1/jobs/{id}/result:
    post:
      tags: [worker]
      operationId: submitResult
      summary: Post the result of a leased job.
      description: >
        The combined UTF-8 output and error payload may not exceed 1048576
        bytes. Larger results receive 400 without completing the lease.
      parameters:
        - $ref: "#/components/parameters/WorkerVersion"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultRequest" }
      responses:
        "204":
          description: Result accepted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/QueueUnavailable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: >
            The lease has expired, was revoked, was cancelled by its caller, is
            unknown, or belongs to another worker. The result is discarded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /v1/jobs:
    post:
      tags: [caller]
      operationId: submitJob
      summary: Submit a job, optionally waiting for its result.
      description: >
        The authenticated caller principal owns the job. Ownership is never
        supplied by the request; only that principal can read the job status
        or result, including while queued, leased or retained after finishing.
        Admission atomically reserves an active slot, a retained-job slot and
        UTF-8 request/owner bytes plus 1048576 bytes for the eventual result.
        Global or per-caller limits reject admission without creating a job.
        Per-caller saturation returns 429; global saturation returns 503.
        Per-caller limits are checked first when both limits are exhausted.
        These capacity responses include Retry-After: 1, a retry suggestion
        rather than a guarantee. Finished jobs remain readable for one minute;
        active reservations are released on completion or deadline expiry, and
        retained result bytes and slots are released when retention ends.
        With a configured private state directory, acknowledged submissions,
        leases, acknowledgements and results survive process restart. Without
        one, the queue is explicitly volatile. Original deadlines and one-minute
        terminal retention are never extended by restart or retry. Live leases
        retain their worker and lease ID; pending acknowledgement windows retain
        their original due time and can revoke the old lease after recovery.
        Storage failure returns 503 and blocks queue operations until restart.
        An optional Idempotency-Key is scoped to the authenticated caller.
        Repeating the key with the same normalized request returns the original
        job before checking worker availability or admission limits. Different
        payloads return 409. Normalization treats omitted or zero num_predict
        as 128; wait and request IDs do not affect identity. The key is retained
        exactly as long as its job, then may be reused for a new job. Clients
        must retain their key across ambiguous responses; no automatic retry or
        exactly-once execution across external failures is promised.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: wait
          in: query
          description: >
            Go duration (e.g. `1500ms`). If the result arrives within it, it is
            returned in this response. Never longer than the job's deadline.
          schema: { type: string, default: 0s }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitRequest" }
      responses:
        "200":
          description: Finished within `wait`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "202":
          description: Queued or running; poll `GET /v1/jobs/{id}`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: The caller already used this idempotency key with another normalized request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: >
            The deadline passed without a result (`expired`), or an
            idempotent replay found a job its caller already cancelled
            (`cancelled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "503":
          description: No online worker serves this model, global queue or persistent storage capacity is exhausted, or storage is unavailable. Take the fallback path now.
          headers:
            Retry-After:
              description: Present as 1 when global queue capacity is exhausted.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/jobs/{id}:
    get:
      tags: [caller]
      operationId: getJob
      summary: Wait for a job's result.
      description: >
        Only the authenticated caller principal that submitted the job can read
        it. Unknown jobs, jobs owned by another caller and jobs whose retention
        has ended receive the same 404 response before any waiting begins.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/JobID"
        - name: wait
          in: query
          description: Go duration. Never longer than the job's deadline.
          schema: { type: string, default: 0s }
      responses:
        "200":
          description: Finished (`done` or `failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "202":
          description: Still queued or running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/QueueUnavailable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: Unknown job, another caller owns it, or retention has ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: The deadline passed without a result (`expired`) or the caller cancelled the job (`cancelled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
  /v1/jobs/{id}/cancel:
    post:
      tags: [caller]
      operationId: cancelJob
      summary: Cancel a queued or leased job.
      description: >
        Only the authenticated caller principal that submitted the job can
        cancel it; unknown jobs, jobs owned by another caller and jobs whose
        retention has ended receive the same 404. Worker and admin credentials
        are refused with 401. The request has no body.


        A queued job leaves the queue at once. A leased job's lease ends at
        once: its worker's next ack is refused with 409, which stops generation,
        and a later result is refused with 409 and discarded. The cancelled
        state is committed to durable storage (when configured) before the
        response, so it survives restart; its prompt is erased and it stays
        readable for one minute like any terminal job, together with its
        Idempotency-Key.


        Cancelling a cancelled job again returns 200 with the same status.
        Cancelling a job that already finished (`done`, `failed`) or expired
        changes nothing and returns 409 with its current status; a result that
        was committed first is never discarded. At or after the deadline the
        job is `expired`, not `cancelled`. Cancellation does not refund the
        caller: the retained job keeps counting against its retained-job limit
        until retention ends.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job is cancelled (now or by an earlier request).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "409":
          description: The job already reached another terminal state; its status is returned unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown job, another caller owns it, or retention has ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/QueueUnavailable" }
  /v1/status:
    get:
      tags: [caller]
      operationId: getStatus
      summary: Is anyone online?
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current worker availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: dumb_admin_session
      description: Opaque admin browser session; only accepted when a provider is configured. Management requires the explicit admin-manage role and exact Origin.
    bearer:
      type: http
      scheme: bearer
      description: >
        Per-principal opaque token. Workers and callers hold different roles; a
        worker token cannot submit jobs and a caller token cannot claim them. The
        separate admin-read role permits only admin metadata endpoints; caller and
        worker roles cannot access them and admin-read cannot perform their operations.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Caller-owned retry key; retained until this job leaves terminal retention.
      schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._:-]{1,64}$" }

    AdminModel:
      name: model
      in: query
      description: Exact model name. Summary filters online worker capacity only; job counts and latency remain global.
      schema: { type: string, minLength: 1 }
    AdminWorkerState:
      name: state
      in: query
      schema: { type: string, enum: [online-idle, online-busy, offline] }
    AdminJobState:
      name: state
      in: query
      schema: { type: string, enum: [queued, leased, done, failed, expired, cancelled] }
    AdminOffset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    WorkerVersion:
      name: X-DUMB-Worker-Version
      in: header
      required: true
      description: The worker's semantic version, e.g. `1.4.2`.
      schema: { type: string, pattern: '^v?\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' }
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Optional id to trace the request by. Kept when it matches the pattern,
        otherwise replaced by a generated one; echoed in the `X-Request-ID`
        response header either way.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
    JobID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, wrong or revoked credential, or the wrong role.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QueueUnavailable:
      description: Persistent queue storage is unavailable or its configured capacity is exhausted. No transition is acknowledged on failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: >
        A rate limit was exceeded: this principal's, or this client IP's after
        failed authentications; caller job admission also uses this response
        when a caller queue limit is exhausted. Retry after `Retry-After`
        seconds; queue capacity is not guaranteed at that time.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (at least 1).
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpgradeRequired:
      description: The worker is older than `min_worker_version`. Update before retrying.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpgradeError" }
  schemas:
    Credential:
      type: object
      additionalProperties: false
      required: [credential_id, principal_id, role, created_at, expires_at, revoked]
      properties:
        credential_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        principal_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        role: { type: string, enum: [caller, worker] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Imported legacy non-expiring credentials use the zero timestamp. }
        revoked: { type: boolean }
    CredentialPage:
      type: object
      additionalProperties: false
      required: [total, offset, limit, items]
      properties:
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        items: { type: array, items: { $ref: "#/components/schemas/Credential" } }
    IssueCredentialRequest:
      type: object
      additionalProperties: false
      required: [role, ttl_seconds]
      properties:
        role: { type: string, enum: [caller, worker] }
        ttl_seconds: { type: integer, minimum: 1, maximum: 31622400 }
    RotateCredentialRequest:
      type: object
      additionalProperties: false
      required: [ttl_seconds]
      properties:
        ttl_seconds: { type: integer, minimum: 1, maximum: 31622400 }
    IssuedCredential:
      type: object
      additionalProperties: false
      required: [credential, token]
      properties:
        credential: { $ref: "#/components/schemas/Credential" }
        token: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
    CreatePairingRequest:
      type: object
      additionalProperties: false
      required: [ttl_seconds, credential_ttl_seconds]
      properties:
        worker_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        ttl_seconds: { type: integer, minimum: 1, maximum: 600 }
        credential_ttl_seconds: { type: integer, minimum: 1, maximum: 31622400 }
    PairingCode:
      type: object
      additionalProperties: false
      required: [code, expires_at, worker_id]
      properties:
        code: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
        expires_at: { type: string, format: date-time }
        worker_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    PairRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
    AdminSession:
      type: object
      additionalProperties: false
      required: [authenticated]
      description: >
        The optional fields are present only for an authenticated session, so an
        anonymous request learns nothing about the server configuration. Older
        servers send only authenticated; clients treat a missing field as absent
        capability.
      properties:
        authenticated: { type: boolean }
        role:
          type: string
          enum: [admin-read, admin-manage]
          description: Role of the authenticated session. Only admin-manage may create pairing codes.
        credential_management:
          type: boolean
          description: >
            True when the server has credential management configured (a credential
            provider, a browser session provider and an exact admin origin), so
            admin-manage sessions can call the credential and pairing endpoints.
            Absent or false means those endpoints are unavailable.
        public_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: >
            Optional public HTTPS base URL that workers use to reach this server.
            The admin page may be reached through a tunnel, so its own origin is not
            this URL. Absent when not configured.
    AdminLogin:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 512 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    UpgradeError:
      type: object
      required: [error, min_worker_version]
      properties:
        error: { type: string }
        min_worker_version: { type: string }
    HelloRequest:
      type: object
      required: [worker_version, protocol_version, models, capacity]
      properties:
        worker_version: { type: string }
        worker_name:
          type: string
          description: >
            Optional human-readable name shown in the admin panel (the worker
            sends its hostname unless configured otherwise). Display only: it is
            never used for authentication, routing or identity, which stay on
            the credential's `worker_id`. The server trims surrounding
            whitespace and keeps at most 64 characters; a name with invalid
            UTF-8, control or format characters is treated as absent rather
            than rejected. Absent in older workers; older servers ignore it.
        protocol_version: { type: integer, minimum: 1 }
        models:
          type: array
          items: { type: string }
          description: Ollama model names present on this worker.
        capacity:
          type: integer
          minimum: 1
          description: Jobs this worker can run at the same time.
        features:
          type: array
          items: { type: string }
          description: >
            Optional protocol behaviours this worker supports. Known: `ack`
            (acknowledges assignments, see `POST /v1/jobs/{id}/ack`). Unknown
            values are ignored.
    HelloResponse:
      type: object
      required: [worker_id, min_worker_version, max_wait]
      properties:
        worker_id: { type: string }
        min_worker_version: { type: string }
        max_wait:
          type: string
          description: Longest `wait` the server honours on `GET /v1/jobs/next`.
        recommended_worker_version:
          type: string
          description: >
            Optional. The worker version the operator wants the fleet to run;
            never lower than `min_worker_version`, absent when not configured.
            A worker older than it checks its own signed release source (GitHub
            Releases, minisign-verified) at once instead of waiting for its
            periodic check, without interrupting jobs in flight. The server never
            supplies a binary or a download location, and a version the worker
            has rolled back is not retried. Unlike `min_worker_version`, being
            older is not an error.
    WhoAmI:
      type: object
      required: [worker_id, min_worker_version]
      properties:
        worker_id: { type: string }
        min_worker_version: { type: string }
        recommended_worker_version:
          type: string
          description: Optional; same meaning as in `HelloResponse`.
    SubmitRequest:
      type: object
      required: [model, prompt, deadline_ms]
      properties:
        model: { type: string }
        prompt: { type: string }
        system: { type: string }
        format:
          type: string
          enum: ["", json]
          description: "`json` asks the model for strict JSON output."
        num_predict:
          type: integer
          minimum: 0
          maximum: 128
          default: 128
          description: Maximum generated tokens; omitted or zero uses 128. The server rejects values above 128.
        deadline_ms:
          type: integer
          minimum: 1
          maximum: 600000
          description: Time from submission after which the result is useless.
    Assignment:
      type: object
      required: [job_id, lease_id, lease_expires_at, model, prompt, num_predict]
      properties:
        job_id: { type: string }
        lease_id: { type: string }
        lease_expires_at: { type: string, format: date-time }
        model: { type: string }
        prompt: { type: string }
        system: { type: string }
        format: { type: string }
        num_predict:
          type: integer
          minimum: 1
          maximum: 128
          description: Server-resolved maximum generated tokens, passed to Ollama options.num_predict.
    AckRequest:
      type: object
      required: [lease_id]
      properties:
        lease_id: { type: string }
    ResultRequest:
      type: object
      required: [lease_id]
      description: Exactly one of `output` or `error`.
      properties:
        lease_id: { type: string }
        output: { type: string }
        error: { type: string }
    JobStatus:
      type: object
      required: [job_id, state]
      properties:
        job_id: { type: string }
        state:
          type: string
          enum: [queued, leased, done, failed, expired, cancelled]
        output: { type: string }
        error: { type: string }
    Status:
      type: object
      required: [workers_online, models]
      properties:
        workers_online:
          type: integer
          description: Workers seen recently that announced at least one model and have not said goodbye.
        models:
          type: array
          items: { type: string }
          description: Models served by at least one online worker.
    AdminApiCounters:
      type: object
      additionalProperties: false
      required: [total_requests, window_requests, inflight, success, redirects, client_errors, server_errors, unauthorized, rate_limited, mean_latency_ms]
      properties:
        total_requests: {type: integer, minimum: 0}
        window_requests: {type: integer, minimum: 0}
        inflight: {type: integer, minimum: 0}
        success: {type: integer, minimum: 0, description: Completed 2xx responses in the rolling window.}
        redirects: {type: integer, minimum: 0}
        client_errors: {type: integer, minimum: 0}
        server_errors: {type: integer, minimum: 0}
        unauthorized: {type: integer, minimum: 0, description: Window 401 and 403 responses; included in client_errors.}
        rate_limited: {type: integer, minimum: 0, description: Window 429 responses; included in client_errors.}
        mean_latency_ms: {type: [number, 'null'], minimum: 0}
    AdminApiRoute:
      type: object
      additionalProperties: false
      required: [total_requests, window_requests, inflight, success, redirects, client_errors, server_errors, unauthorized, rate_limited, mean_latency_ms, route]
      properties:
        total_requests: {type: integer, minimum: 0}
        window_requests: {type: integer, minimum: 0}
        inflight: {type: integer, minimum: 0}
        success: {type: integer, minimum: 0, description: Completed 2xx responses in the rolling window.}
        redirects: {type: integer, minimum: 0}
        client_errors: {type: integer, minimum: 0}
        server_errors: {type: integer, minimum: 0}
        unauthorized: {type: integer, minimum: 0, description: Window 401 and 403 responses; included in client_errors.}
        rate_limited: {type: integer, minimum: 0, description: Window 429 responses; included in client_errors.}
        mean_latency_ms: {type: [number, 'null'], minimum: 0}
        route: {type: string, description: Fixed allowlisted method and route template or other.}
    AdminApiBucket:
      type: object
      additionalProperties: false
      required: [at, requests, client_errors, server_errors, rate_limited]
      properties:
        at: {type: string, format: date-time}
        requests: {type: integer, minimum: 0}
        client_errors: {type: integer, minimum: 0}
        server_errors: {type: integer, minimum: 0}
        rate_limited: {type: integer, minimum: 0}
    AdminApi:
      type: object
      additionalProperties: false
      required: [total_requests, window_requests, inflight, success, redirects, client_errors, server_errors, unauthorized, rate_limited, mean_latency_ms, snapshot_at, epoch, uptime_seconds, status, window_seconds, requests_per_second, routes, history]
      properties:
        total_requests: {type: integer, minimum: 0}
        window_requests: {type: integer, minimum: 0}
        inflight: {type: integer, minimum: 0}
        success: {type: integer, minimum: 0, description: Completed 2xx responses in the rolling window.}
        redirects: {type: integer, minimum: 0}
        client_errors: {type: integer, minimum: 0}
        server_errors: {type: integer, minimum: 0}
        unauthorized: {type: integer, minimum: 0, description: Window 401 and 403 responses; included in client_errors.}
        rate_limited: {type: integer, minimum: 0, description: Window 429 responses; included in client_errors.}
        mean_latency_ms: {type: [number, 'null'], minimum: 0}
        snapshot_at: {type: string, format: date-time}
        epoch: {type: string, format: date-time}
        uptime_seconds: {type: number, minimum: 0}
        status: {type: string, enum: [serving]}
        window_seconds: {type: integer, enum: [300]}
        requests_per_second: {type: number, minimum: 0, description: Completed window requests divided by observed window duration (bounded by uptime).}
        routes:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/AdminApiRoute'}
        history:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/AdminApiBucket'}
    AdminSummary:
      type: object
      additionalProperties: false
      description: Current queued and leased counts exclude elapsed deadlines. Done, failed, expired and cancelled are cumulative since epoch. Online slots count each worker once; offline leases remain in the global leased count. Latency covers at most 256 completed jobs in the last 300 seconds; absent samples yield null means. Model filtering affects worker capacity only.
      required: [snapshot_at, epoch, workers_online, capacity, active_slots, free_slots, queued, leased, done, failed, expired, cancelled, models, oldest_queued_ms, latency_samples, mean_wait_ms, mean_completion_ms, measurement_window_seconds]
      properties:
        snapshot_at: { type: string, format: date-time }
        epoch: { type: string, format: date-time }
        workers_online: { type: integer, minimum: 0 }
        capacity: { type: integer, minimum: 0 }
        active_slots: { type: integer, minimum: 0 }
        free_slots: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        leased: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        expired: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        models: { type: array, items: { type: string } }
        oldest_queued_ms: { type: integer, minimum: 0 }
        latency_samples: { type: integer, minimum: 0 }
        mean_wait_ms: { type: [number, "null"], minimum: 0 }
        mean_completion_ms: { type: [number, "null"], minimum: 0 }
        measurement_window_seconds: { type: integer, const: 300 }
    AdminWorker:
      type: object
      additionalProperties: false
      description: Displayed worker identifiers are limited to 128 characters, versions to 64 characters and models to the first 100 names of at most 128 characters each. Online status uses the existing worker TTL and goodbye rules. Free slots are max(0, capacity minus live leases); live leases may exceed newly reduced capacity.
      required: [worker_id, worker_version, models, capacity, live_leases, free_slots, last_seen, state]
      properties:
        worker_id: { type: string }
        worker_name:
          type: string
          maxLength: 64
          description: Display-only name from the worker's latest hello after server-side normalization; absent when the worker sent none or an invalid one. Not an identifier.
        worker_version: { type: string }
        models: { type: array, items: { type: string } }
        capacity: { type: integer, minimum: 0 }
        live_leases: { type: integer, minimum: 0 }
        free_slots: { type: integer, minimum: 0 }
        last_seen: { type: string, format: date-time }
        state: { type: string, enum: [online-idle, online-busy, offline] }
    AdminJob:
      type: object
      additionalProperties: false
      description: Displayed model names are limited to 128 characters. Metadata for existing retained jobs only; retention is unchanged. Wait is elapsed queue time or time until the latest lease. Lists sort newest first by creation time, then by job id descending.
      required: [job_id, model, state, created_at, deadline_at]
      properties:
        job_id: { type: string }
        model: { type: string }
        state: { type: string, enum: [queued, leased, done, failed, expired, cancelled] }
        created_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        leased_at: { type: string, format: date-time }
        worker_id: { type: string }
        wait_ms: { type: integer, minimum: 0 }
    AdminWorkers:
      type: object
      additionalProperties: false
      description: Workers sorted by worker id. Total is the filtered count before pagination. Epoch is server startup time; snapshot_at is observation time.
      required: [snapshot_at, epoch, total, offset, limit, items]
      properties:
        snapshot_at: { type: string, format: date-time }
        epoch: { type: string, format: date-time }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0, maximum: 10000 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        items: { type: array, items: { $ref: "#/components/schemas/AdminWorker" } }
    AdminQueue:
      type: object
      additionalProperties: false
      description: Total is the filtered count before pagination. Epoch is server startup time; snapshot_at is observation time.
      required: [snapshot_at, epoch, total, offset, limit, items]
      properties:
        snapshot_at: { type: string, format: date-time }
        epoch: { type: string, format: date-time }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0, maximum: 10000 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        items: { type: array, items: { $ref: "#/components/schemas/AdminJob" } }
